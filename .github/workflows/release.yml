name: release
on:
  push:
    branches: [main]
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-go@main
        with:
          go-version: '1.24'
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gopeg_macos
          path: packages/gopeg_macos
  release:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt install -y libgl1-mesa-dev xorg-dev libxxf86vm-dev # X11 headers
      - run: sudo apt install -y gcc-mingw-w64-x86-64 # C cross compiler for windows
      - uses: actions/checkout@main
        with:
          token: ${{ secrets.PAT }}
          persist-credentials: true
      - uses: actions/setup-node@main
        with:
          node-version: '20'
      - uses: actions/setup-go@main
        with:
          go-version: '1.24'
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ hashFiles('go.sum') }}
      - run: ./build.sh
      - uses: actions/download-artifact@v4
        with:
          name: gopeg_macos
          path: packages
      - run: chmod +x packages/gopeg_macos # artifacts drop the executable bit
      - run: |
          npm install -g \
            semantic-release \
            @semantic-release/github \
            @semantic-release/git \
            @semantic-release/exec \
            @semantic-release/changelog \
            @semantic-release/npm \
            aggregate-error@3.1.0
      - run: semantic-release
        env:
          GH_TOKEN: ${{ secrets.PAT }}
